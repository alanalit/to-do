<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f3ed" />
    <meta name="description" content="Um espaço simples para organizar suas tarefas do dia." />
    <title>Organize.se — Lista de tarefas</title>
    <link rel="stylesheet" href="css/styles.css" />
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <a class="brand" href="#inicio" aria-label="Meu dia, início">
          <span class="brand-mark" aria-hidden="true">O</span>
          <span>organize<span class="brand-dot">.</span>se</span>
        </a>
        <span class="topbar-note">ORGANIZE COM LEVEZA</span>
      </header>

      <main id="inicio" class="main-content">
        <section class="intro" aria-labelledby="page-title">
          <h1 id="page-title">Um passo de cada vez<span class="title-period">.</span></h1>
        </section>

        <section class="task-panel" aria-labelledby="tasks-title">
          <form class="task-form" id="task-form" novalidate>
            <label class="visually-hidden" for="task-title">O que você precisa fazer?</label>
            <span class="input-icon" aria-hidden="true">＋</span>
            <input id="task-title" name="title" type="text" placeholder="O que você precisa fazer?" autocomplete="off" required aria-describedby="form-feedback" />
            <button class="add-button" type="submit"><span>Adicionar</span><span aria-hidden="true">↗</span></button>
          </form>
          <p class="form-feedback" id="form-feedback" role="status" aria-live="polite"></p>

          <div class="list-heading">
            <div>
              <p class="eyebrow">SUA LISTA</p>
              <h2 id="tasks-title">Tarefas de hoje</h2>
            </div>
            <span class="task-count" id="task-count" aria-label="0 tarefas">00</span>
          </div>

          <div class="task-filters" id="task-filters" role="group" aria-label="Filtrar tarefas">
            <button class="filter-button" type="button" data-filter="all" aria-pressed="true">
              Todas <span class="filter-count" id="count-all">00</span>
            </button>
            <button class="filter-button" type="button" data-filter="pending" aria-pressed="false">
              Pendentes <span class="filter-count" id="count-pending">00</span>
            </button>
            <button class="filter-button" type="button" data-filter="completed" aria-pressed="false">
              Concluídas <span class="filter-count" id="count-completed">00</span>
            </button>
          </div>

          <ul class="task-list" id="task-list" aria-labelledby="tasks-title">
            <li class="empty-state">
              <span class="empty-illustration" aria-hidden="true">
                <span class="sun"></span><span class="empty-paper"><i></i><i></i><i></i></span><span class="empty-spark">✦</span>
              </span>
              <p class="empty-title">Tudo começa com organização.</p>
              <p class="empty-copy">Adicione sua primeira tarefa.</p>
            </li>
          </ul>
          <footer class="panel-footer">Pequenos passos também levam longe.</footer>
        </section>
        <p class="page-note">Feito para deixar a rotina mais leve <span aria-hidden="true">♡</span></p>
      </main>
    </div>
  </body>
</html>
